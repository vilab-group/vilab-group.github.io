# =============================================================================
# Publications
#
# sources.yaml 에서 변환된 파일입니다. 최신순으로 정렬되어 있고,
# 템플릿이 `year` 로 자동 그룹핑한 뒤 그룹 안에서 `date` 로 다시 정렬합니다.
#
#   year     연도 (그룹 헤더)
#   date     정확한 날짜 — 같은 해 안에서의 순서를 결정
#   title    논문 제목
#   authors  HTML 문자열. 연구실 멤버는 <strong>...</strong>, 각주는 <sup>...</sup>
#   venue    학술지 / 학회명 (지표 정보는 분리)
#   metrics  SCIE·I.F.·JCR 등 색인 정보 — 없으면 생략
#   note     '*Equally contributed' 같은 저자 각주 — 없으면 생략
#   doi      DOI (표시용 아님, 나중에 BibTeX·Crossref 연동용으로 보관)
#   thumb    썸네일 경로. paper_img 폴더를 저장소 루트에 그대로 두면 됩니다
#   tags     주제 태그 (현재 미노출, 향후 필터링용)
#   links    버튼으로 렌더링됨
#
# 새 논문은 맨 위에 추가하세요.
# =============================================================================

