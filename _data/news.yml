- title: "Our lab attended the 2025 KOSOMBE fall conference"
  date:  2025-11-10
  tags:  [News]
  url:   "#"
  thumb: "/assets/img/news/2025_FALL_KOSOMBE.jpeg"
  excerpt: "2025년 11월 6일부터 8일까지 김해 인제대학교에서 진행된 대한의용생체공학회 추계 학술대회에 우리랩 멤버들(이해윤, 이찬근, 박준한)이 참가했습니다. 
            이찬근 학생은 \"Box-Aware SAM: Robust YOLO-Prompted Ultrasound Segmentation with HF Guidance\"라는 연구를 포스터 발표하였습니다."

